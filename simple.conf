server {
    listen 8808;
    server_name localhost;
    host 127.0.0.1;
    client_max_size 100000000;

    location / {
        root /www/simple;
        index index.html;
        allowed GET POST HEAD OPTIONS;
        cgi .py ./www/simple/bin/session.py;
        autoindex false;
    }

    location /index.php {
        allowed GET;
        cgi .php ./www/simple/index.php;
    }

	location /index.py {
        allowed GET;
        cgi .py ./www/simple/index.py;
    }

    location /get {
        root /www/simple;
        index get.html;
        allowed GET;
        autoindex false;
    }

    location /post {
         root /www/simple;
         index post.html;
         allowed GET POST;
         autoindex false;
    }

    location /create_file.py {
        allowed GET POST;
        cgi .py ./www/simple/bin/create_file.py;
    }

    location /upload_file.php {
        allowed GET POST;
        cgi .php ./www/simple/bin/upload_file.php;
    }

    location /delete {
        root /www/simple;
        index delete.html;
        allowed GET DELETE;
        autoindex false;
    }

    location /delete_file.py {
        allowed GET DELETE;
        cgi .py ./www/simple/bin/delete_file.py;
    }

    location /put {
        root /www/simple;
        index put.html;
        allowed GET PUT HEAD;
        autoindex false;
    }

    location /put_file.py {
        allowed GET PUT;
        cgi .py ./www/simple/bin/put_file.py;
    }

    location /head {
        root /www/simple;
        index head.html;
        allowed GET HEAD;
        autoindex false;
    }

    location /options {
        root /www/simple;
        index options.html;
        allowed GET OPTIONS;
        autoindex false;
    }

    location /patch {
        root /www/simple;
        index patch.html;
        allowed GET PATCH;
        autoindex false;
    }

    location /patch_file.py {
        root /www/simple;
        index patch.html;
        allowed GET PATCH;
        autoindex false;
        cgi .py ./www/simple/bin/patch_file.py;
    }

    location /session.py {
        cgi .py ./www/simple/bin/session.py;
        allowed GET POST PATCH PUT DELETE;
    }

    location /files {
        root /www/simple/files;
        allowed GET POST DELETE PATCH;
        autoindex true;
    }
}

server {
    listen 8085;
    server_name localhost;
    host 127.0.0.1;
    client_max_size 10000;
    location / {
        allowed GET POST HEAD OPTIONS;
    }

    location /localhost:8808 {
        allowed GET;
    }
}