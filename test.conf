server {
    listen 8808;
    server_name localhost;
    host 127.0.0.1;
    client_max_size 100000000;

    location / {
        root ./www/simple;
        index index.html;
        allowed GET;
        autoindex false;
    }

    location /post_body {
        root ./www/simple;
        allowed POST;
        client_max_size 100;
        autoindex false;
    }

    location /directory/ {
        root ./YoupiBanane;
        index youpi.bad_extension;
        allowed GET POST;
        autoindex false;
        cgi .bla ./cgi_tester;
    }

    location /directory {
        allowed GET;
        return 301 /directory/;
    }
}