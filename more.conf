server {
    listen 8080;
    host 127.0.0.1;
    server_name example.xt;

    location / {
        root /www/two;
        index green.html;
        allowed GET;
    }
}

server {
    listen 8081;
    host 127.0.0.1;
    server_name example.nga;

    location / {
        root /www/two;
        index blue.html;
        allowed GET;
    }
}