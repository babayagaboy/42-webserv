server {
    listen 8080;
    host 127.0.0.1;
    server_name example.xt;
    client_max_size 10000;

    location /
    {
        root /www;
        index index.html;
        autoindex true;

        allowed GET POST DELETE;
        error_page 404 /www/errors/404.html;
        return 200;
    }

    location /images
    {
        root /www/images;
        index index.html;
        autoindex false;

        allowed GET PUT DELETE;
        error_page 404 /www/errors/images404.html;
        return 404;
        cgi .jpg /usr/bin/image-handler;
    }
}


