<!DOCTYPE html>
<html>
<head>
    <title>File Manager</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 70px;
            background: #f4f4f4;
        }

        .container {
            width: 1000px;
            margin: auto;
            display: flex;
            gap: 30px;
        }

        .panel {
            box-sizing: border-box;
            width: 50%;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            margin-top: 0;
        }

        input,
        textarea {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 20px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        textarea {
            height: 180px;
            resize: vertical;
        }

        input[type="file"] {
            background: #f9f9f9;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background: #4CAF50;
            color: white;
        }

        button:hover {
            background: #45a049;
        }

        button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        .response {
            margin-top: 25px;
            font-size: 18px;
            font-weight: bold;
            word-break: break-word;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- CREATE FILE -->
    <div class="panel">

        <h1>Create File</h1>

        <label for="filename">File name</label>

        <input
            type="text"
            id="filename"
            placeholder="example.txt"
        >

        <label for="content">File content</label>

        <textarea
            id="content"
            placeholder="Write the content of your file here..."
        ></textarea>

        <button onclick="sendPOST()">
            Create File
        </button>

        <p id="createResponse" class="response"></p>

    </div>


    <!-- UPLOAD FILE -->
    <div class="panel">

        <h1>Upload File</h1>

        <form id="uploadForm">

            <label for="file">
                Choose a file
            </label>

            <input
                type="file"
                id="file"
                name="file"
                required
            >

            <button type="submit">
                Upload File
            </button>

        </form>

        <p id="uploadResponse" class="response"></p>

    </div>

</div>


<script>

    /*
     * CREATE FILE
     *
     * Sends JSON to create_file.py
     */
    function sendPOST()
    {
        const filename =
            document.getElementById("filename").value;

        const content =
            document.getElementById("content").value;

        const responseElement =
            document.getElementById("createResponse");

        const data = JSON.stringify({
            filename: filename,
            content: content
        });

        fetch('/create_file.py', {
            method: 'POST',

            headers: {
                'Content-Type': 'application/json'
            },

            body: data
        })
        .then(response => response.text())
        .then(message => {
            responseElement.textContent = message;
        })
        .catch(error => {
            responseElement.textContent =
                "Error: " + error;
        });
    }


    /*
     * UPLOAD FILE
     *
     * Sends the selected file as multipart/form-data
     * to upload_file.php
     */
    document.getElementById("uploadForm")
        .addEventListener("submit", function(event)
        {
            event.preventDefault();

            const fileInput =
                document.getElementById("file");

            const responseElement =
                document.getElementById("uploadResponse");

            if (fileInput.files.length === 0)
            {
                responseElement.textContent =
                    "Please select a file.";

                return;
            }

            const formData = new FormData();

            formData.append(
                "file",
                fileInput.files[0]
            );

            responseElement.textContent =
                "Uploading...";

            fetch('/upload_file.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.text())
            .then(message => {
                responseElement.textContent = message;
            })
            .catch(error => {
                responseElement.textContent =
                    "Error: " + error;
            });
        });

</script>

</body>
</html>
