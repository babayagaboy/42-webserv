<!DOCTYPE html>
<html>
<head>
    <title>CONNECT Tester</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 70px;
            background: #f4f4f4;
        }

        .container {
            width: 500px;
            margin: auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 20px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background: #cf0da8;
            color: white;
        }

        button:hover {
            background: #f254d2;
        }

        button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        #response {
            margin-top: 25px;
            font-size: 18px;
            font-weight: bold;
            word-break: break-word;
        }

        #terminal {
            margin-top: 25px;
            padding: 15px;
            min-height: 150px;
            background: #111;
            color: #00ff00;
            text-align: left;
            font-family: monospace;
            white-space: pre-wrap;
            border-radius: 6px;
            overflow-y: auto;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>CONNECT</h1>

    <label for="ip">DNS</label>

    <input
        type="text"
        id="ip"
        placeholder="message here..."
    >

    <button id="connectButton" onclick="sendConnect()">
        Send
    </button>

    <p id="response"></p>

    <div id="terminal"></div>

</div>

<script>
    let pollingStarted = false;

    function appendTerminal(message)
    {
        const terminal = document.getElementById("terminal");
        terminal.insertAdjacentText("beforeend", message);
        localStorage.setItem("connect-terminal-history", terminal.textContent);
    }

    document.getElementById("terminal").textContent =
        localStorage.getItem("connect-terminal-history") || "";

    async function sendConnect()
    {
            const target = document.getElementById("ip").value;
        const responseElement = document.getElementById("response");
        const button = document.getElementById("connectButton");

        if (!target.trim())
        {
            responseElement.textContent = "Please enter a target.";
            return;
        }

        button.disabled = true;
        responseElement.textContent = "Connecting...";

        try
        {
            const response = await fetch("/connect-message", {
                method: "POST",
                headers: {
                    "Content-Type": "text/plain"
                },
                body: target + "\n"
            });

            const message = await response.text();

            if (!response.ok)
            {
                responseElement.textContent = "Error: " + message;
                return;
            }

            appendTerminal(target + "\n");
            responseElement.textContent = "";
            document.getElementById("ip").value = "";
            if (!pollingStarted)
            {
                pollingStarted = true;
                startPolling();
            }
        }
        catch (error)
        {
            responseElement.textContent = "Error: " + error;
        }
        finally
        {
            button.disabled = false;
        }
    }

    async function startPolling()
    {
        try
        {
            const response = await fetch("/connect-status");
            const message = await response.text();

            if (message)
            {
                appendTerminal(message);
            }
        }
        catch (error)
        {
            console.error(error);
        }

        setTimeout(startPolling, 500);
    }

    pollingStarted = true;
    startPolling();
</script>

</body>
</html>
