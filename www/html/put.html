<!DOCTYPE html>
<html>
<head>
    <title>PUT File</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 70px;
            background: #f4f4f4;
        }

        .container {
            width: 500px;
            margin: auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        select,
        input,
        textarea {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 20px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        textarea {
            height: 180px;
            resize: vertical;
            font-family: monospace;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background: #1d1aca;
            color: white;
        }

        button:hover {
            background: #2f2ce2;
        }

        #response {
            margin-top: 25px;
            font-size: 18px;
            font-weight: bold;
        }

        #newFilename {
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>PUT File</h1>

    <label for="filename">
        Select a file
    </label>

    <select id="filename" onchange="loadFileContent()">
        <option value="">Loading files...</option>
    </select>

    <input
        type="text"
        id="newFilename"
        placeholder="Enter new filename, e.g. user.json"
    >

    <label for="content">
        File content
    </label>

    <textarea
        id="content"
        placeholder="Select a file..."
    ></textarea>

    <button onclick="sendPUT()">
        PUT File
    </button>

    <p id="response"></p>

</div>

<script>

    function loadFiles()
    {
        fetch('/files')
        .then(response => {

            if (!response.ok)
                throw new Error("Could not load files");

            return response.json();

        })
        .then(files => {

            const select =
                document.getElementById("filename");

            select.innerHTML = "";


            // Create new file option
            const newOption =
                document.createElement("option");

            newOption.value = "__new__";
            newOption.textContent = "Create new file";

            select.appendChild(newOption);


            // Existing files
            files.forEach(file => {

                const option =
                    document.createElement("option");

                option.value = file;
                option.textContent = file;

                select.appendChild(option);

            });


            // Start with create new file
            select.value = "__new__";

            loadFileContent();

        })
        .catch(error => {

            document.getElementById("response").textContent =
                "Could not load files: " + error;

        });
    }


    function loadFileContent()
    {
        const filename =
            document.getElementById("filename").value;

        const textarea =
            document.getElementById("content");

        const newFilename =
            document.getElementById("newFilename");


        /*
         * CREATE NEW FILE
         */
        if (filename === "__new__")
        {
            newFilename.style.display = "block";

            textarea.value = "";

            document.getElementById("response").textContent =
                "Create a new file.";

            return;
        }


        /*
         * EXISTING FILE
         */
        newFilename.style.display = "none";


        if (!filename)
        {
            textarea.value = "";
            return;
        }


        document.getElementById("response").textContent =
            "Loading " + filename + "...";


        fetch('/files/' + encodeURIComponent(filename))
        .then(response => {

            if (!response.ok)
                throw new Error(
                    "Server returned " + response.status
                );

            return response.text();

        })
        .then(content => {

            console.log("Loaded content:", content);

            textarea.value = content;

            document.getElementById("response").textContent =
                "Loaded: " + filename;

        })
        .catch(error => {

            console.error(error);

            textarea.value = "";

            document.getElementById("response").textContent =
                "Could not load file: " + error;

        });
    }


    function sendPUT()
    {
        const selectedFilename =
            document.getElementById("filename").value;

        const newFilename =
            document.getElementById("newFilename").value.trim();

        const content =
            document.getElementById("content").value;


        let filename;


        /*
         * CREATE NEW FILE
         */
        if (selectedFilename === "__new__")
        {
            if (!newFilename)
            {
                document.getElementById("response").textContent =
                    "Please enter a filename.";

                return;
            }

            filename = newFilename;
        }


        /*
         * EXISTING FILE
         */
        else
        {
            if (!selectedFilename)
            {
                document.getElementById("response").textContent =
                    "Please select a file.";

                return;
            }

            filename = selectedFilename;
        }


        const data = JSON.stringify({
            filename: filename,
            content: content
        });


        fetch('/put_file.py', {

            method: 'PUT',

            headers: {
                'Content-Type': 'application/json'
            },

            body: data

        })
        .then(response => {

            return response.text();

        })
        .then(message => {

            document.getElementById("response").textContent =
                message;

            loadFiles();

        })
        .catch(error => {

            document.getElementById("response").textContent =
                "Error: " + error;

        });
    }


    loadFiles();

</script>

</body>
</html>
