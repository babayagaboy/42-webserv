<!DOCTYPE html>
<html>
<head>
    <title>OPTIONS Method Tester</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 70px;
            background: #f4f4f4;
        }

        .container {
            width: 600px;
            margin: auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 20px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background: #9C27B0;
            color: white;
        }

        button:hover {
            background: #7B1FA2;
        }

        #response {
            margin-top: 25px;
            text-align: left;
        }

        #status {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        #allowed {
            margin-top: 20px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
        }

        pre {
            background: #272822;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 6px;
            text-align: left;
            overflow-x: auto;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>OPTIONS Method Tester</h1>

    <p>
        Send an OPTIONS request and inspect the methods
        allowed by your webserver.
    </p>

    <label for="path">Resource path</label>

    <input
        type="text"
        id="path"
        value="/head"
        placeholder="/index.html"
    >

    <button onclick="sendOPTIONS()">
        Send OPTIONS Request
    </button>

    <div id="response"></div>

</div>

<script>
    function sendOPTIONS()
    {
        const path = document.getElementById("path").value;

        fetch(path, {
            method: 'OPTIONS'
        })
        .then(response => {

            let headers = "";

            response.headers.forEach((value, key) => {
                headers += key + ": " + value + "\n";
            });

            const allow = response.headers.get("Allow");

            document.getElementById("response").innerHTML =
                "<div id='status'>" +
                "Status: " +
                response.status +
                " " +
                response.statusText +
                "</div>" +

                "<div id='allowed'>" +
                "Allowed Methods: " +
                (allow ? allow : "No Allow header") +
                "</div>" +

                "<br>" +

                "<strong>Response Headers:</strong>" +

                "<pre>" +
                headers +
                "</pre>";
        })
        .catch(error => {

            document.getElementById("response").innerHTML =
                "<div id='status'>Error</div>" +
                "<pre>" +
                error +
                "</pre>";
        });
    }
</script>

</body>
</html>
