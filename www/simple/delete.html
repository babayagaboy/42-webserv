        <div class="workspace">
            <main id="main" class="main-content">
                <div class="page-heading">
                    <div>
                        <h1>Delete something</h1>
                    </div>
                </div>
                <section class="form-panel delete-panel" aria-labelledby="delete-title">
                    <h2 id="delete-title">Choose a file</h2>
                    <form id="delete-file-form">
                        <label for="delete-file-choice">Saved file</label>
                        <select id="delete-file-choice" required disabled>
                            <option value="">Loading files…</option>
                        </select>
                        <div class="button-row delete-actions">
                            <button class="button button-danger" id="delete-selected" type="submit" disabled>Delete selected file</button>
                        </div>
                        <p id="delete-file-result" class="form-result" role="status" hidden></p>
                    </form>
                </section>
                <dialog id="delete-dialog" aria-labelledby="delete-heading">
                    <form method="dialog">
                        <h2 id="delete-heading">Delete this file?</h2>
                        <p>
                            <strong id="delete-filename"></strong> will be permanently removed from your server. This cannot be undone.
                        </p>
                        <p id="delete-error" class="inline-message" role="alert" hidden></p>
                        <div class="button-row dialog-actions">
                            <button class="button button-secondary" value="cancel">Keep file</button>
                            <button class="button button-danger" type="button" id="confirm-delete">Delete file</button>
                        </div>
                    </form>
                </dialog>
            </main>
        </div>
