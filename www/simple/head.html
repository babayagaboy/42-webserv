<!DOCTYPE html>
<html>
<head>
    <title>HEAD Method Tester</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 70px;
            background: #f4f4f4;
        }

        .container {
            width: 600px;
            margin: auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 20px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background: #2196F3;
            color: white;
        }

        button:hover {
            background: #1976D2;
        }

        #response {
            margin-top: 25px;
            text-align: left;
        }

        #status {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        pre {
            background: #272822;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 6px;
            text-align: left;
            overflow-x: auto;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>HEAD Method Tester</h1>

    <p>
        Send a HEAD request and inspect the response headers.
    </p>

    <label for="path">Resource path</label>

    <input
        type="text"
        id="path"
        value="/index.html"
        placeholder="/index.html"
    >

    <button onclick="sendHEAD()">
        Send HEAD Request
    </button>

    <div id="response"></div>

</div>

<script>
    function sendHEAD()
    {
        const path = document.getElementById("path").value;

        fetch(path, {
            method: 'HEAD'
        })
        .then(response => {
            let headers = "";

            response.headers.forEach((value, key) => {
                headers += key + ": " + value + "\n";
            });

            document.getElementById("response").innerHTML =
                "<div id='status'>Status: " +
                response.status + " " +
                response.statusText +
                "</div>" +

                "<strong>Response Headers:</strong>" +

                "<pre>" +
                headers +
                "</pre>";
        })
        .catch(error => {
            document.getElementById("response").innerHTML =
                "<div id='status'>Error</div>" +
                "<pre>" + error + "</pre>";
        });
    }
</script>

</body>
</html>
