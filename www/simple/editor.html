        <div class="workspace">
            <main id="main" class="main-content">
                <div class="page-heading">
                    <div>
                        <h1>Post something</h1>
                    </div>
                    <a class="text-link" href="/get">
                        View files <span class="icon arrow-icon" aria-hidden="true"></span>
                    </a>
                </div>
                <div class="creation-grid">
                    <section class="form-panel" aria-labelledby="create-heading">
                        <div class="panel-heading">
                            <h2 id="create-heading">Create a text file</h2>
                            <span class="method-label">POST</span>
                        </div>
                        <form id="create-form" action="/create_file.py" method="post">
                            <label for="filename">Filename</label>
                            <input id="filename" name="filename" type="text" required maxlength="255" autocomplete="off">
                            <label for="content">File content</label>
                            <textarea id="content" name="content" rows="13" spellcheck="false"></textarea>
                            <div class="form-actions">
                                <span class="field-hint" id="content-count">0 characters</span>
                                <button class="button button-primary" type="submit">
                                    <span class="icon plus-icon" aria-hidden="true"></span> Create file
                                </button>
                            </div>
                            <p id="create-result" class="form-result" role="status" hidden></p>
                        </form>
                    </section>
                    <section class="form-panel upload-panel" id="upload" aria-labelledby="upload-heading">
                        <div class="panel-heading">
                            <h2 id="upload-heading">Upload a file</h2>
                            <span class="method-label">POST</span>
                        </div>
                        <form id="upload-form" action="/upload_file.php" method="post" enctype="multipart/form-data">
                            <div class="dropzone" id="dropzone">
                                <span class="icon upload-icon" aria-hidden="true">
                                    <span class="upload-arrow"></span>
                                    <span class="upload-tray"></span>
                                </span>
                                <strong>Drop a file here</strong>
                                <label for="upload-file" class="sr-only">Choose a file to upload</label>
                                <input id="upload-file" name="file" type="file" required>
                            </div>
                            <p id="upload-selection" class="field-hint" aria-live="polite">No file selected.</p>
                            <button class="button button-primary" type="submit">
                                <span class="icon upload-icon" aria-hidden="true">
                                    <span class="upload-arrow"></span>
                                    <span class="upload-tray"></span>
                                </span> Upload file
                            </button>
                            <p id="upload-result" class="form-result" role="status" hidden></p>
                        </form>
                        <div class="help-note">
                            <a class="text-link" href="/edit">
                                Open the editor <span class="icon arrow-icon" aria-hidden="true"></span>
                            </a>
                        </div>
                    </section>
                </div>
            </main>
        </div>
