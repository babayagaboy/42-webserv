        <button id="theme-toggle" class="icon-button theme-toggle" type="button" aria-label="Switch to dark mode" hidden>
            <span class="theme-symbol" aria-hidden="true"></span>
        </button>
        <div class="workspace">
            <main id="main" class="main-content">
                <div class="page-heading">
                    <div>
                        <h1>Update something</h1>
                    </div>
                    <a class="text-link" href="/manager.html">
                        View files <span class="icon arrow-icon" aria-hidden="true"></span>
                    </a>
                </div>
                <div class="edit-grid">
                    <section class="form-panel" aria-labelledby="edit-heading">
                        <h2 id="edit-heading">Edit</h2>
                        <form id="edit-form" action="/methods.py" method="post">
                            <div class="form-columns">
                                <div>
                                    <label for="edit-method">Save method</label>
                                    <select id="edit-method" name="method">
                                        <option value="PUT">PUT — Create or replace</option>
                                        <option value="PATCH">PATCH — Update file</option>
                                    </select>
                                </div>
                                <div>
                                    <label for="edit-filename">Saved file</label>
                                    <select id="edit-filename" name="filename">
                                        <option value="">Choose a saved file</option>
                                        <!-- SAVED_FILE_OPTIONS -->
                                    </select>
                                </div>
                            </div>
                            <div id="new-filename-field">
                                <label for="new-filename">Create a new file</label>
                                <input id="new-filename" name="new_filename" type="text" maxlength="255">
                            </div>
                            <label for="edit-content">File content</label>
                            <textarea id="edit-content" name="content" rows="15" spellcheck="false"></textarea>
                            <p id="load-result" class="field-hint" role="status"></p>
                            <div class="form-actions">
                                <span class="field-hint" id="edit-count">0 characters</span>
                                <button class="button button-primary" type="submit">
                                    Save changes <span class="icon arrow-icon" aria-hidden="true"></span>
                                </button>
                            </div>
                            <p id="edit-result" class="form-result" role="status" hidden></p>
                        </form>
                    </section>
                </div>
            </main>
        </div>
    </body>
